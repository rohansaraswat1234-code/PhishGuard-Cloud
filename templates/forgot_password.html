<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | PhishGuard</title>

    <link
        rel="stylesheet"
        href="/static/auth.css"
    >
</head>

<body>

<div class="auth-page">

    <div class="brand">
        <div class="shield">🛡️</div>

        <h1>PhishGuard Cloud</h1>

        <p>Password Recovery</p>
    </div>

    <div class="auth-card">

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Enter your registered email address.
        </p>

        {% if message %}

        <div class="success-message">
            {{ message }}
        </div>

        {% endif %}

        <form method="POST">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <button
                type="submit"
                class="main-button"
            >
                Generate Reset Link
            </button>

        </form>

        <a
            href="/login"
            class="forgot-link"
        >
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
