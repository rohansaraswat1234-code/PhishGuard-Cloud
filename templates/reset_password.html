<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | PhishGuard</title>

    <link
        rel="stylesheet"
        href="/static/auth.css"
    >
</head>

<body>

<div class="auth-page">

    <div class="brand">
        <div class="shield">🛡️</div>

        <h1>PhishGuard Cloud</h1>
        <p>Secure Password Reset</p>
    </div>


    <div class="auth-card">

        <h2>Reset Password</h2>

        <p class="subtitle">
            Create a new secure password.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        {% if token %}

        <form method="POST">

            <label>New Password</label>

            <input
                type="password"
                name="password"
                minlength="8"
                required
            >

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                minlength="8"
                required
            >

            <button
                type="submit"
                class="main-button"
            >
                Reset Password
            </button>

        </form>

        {% endif %}


        <a
            href="/login"
            class="forgot-link"
        >
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
